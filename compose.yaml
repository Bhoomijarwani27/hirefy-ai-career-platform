
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hirefy-ai

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: development

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    command: sh -c "npx prisma generate && npm run dev -- --hostname 0.0.0.0"